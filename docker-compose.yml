services:
  postgres:
    image: postgres:16-alpine
    container_name: fragance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fragance
      POSTGRES_PASSWORD: fragance_dev_password
      POSTGRES_DB: fragance
    ports:
      - "5434:5432"
    volumes:
      - fragance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragance -d fragance"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fragance-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lyoncall.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
    container_name: fragance-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://fragance:fragance_dev_password@postgres:5432/fragance?schema=public
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fragance_postgres_data:
