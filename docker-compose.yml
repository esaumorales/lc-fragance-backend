# Solo la base de datos para desarrollo. El backend corre fuera, con "pnpm dev",
# que recarga al guardar; el Dockerfile de al lado es el de produccion.
#
# La pila de produccion completa esta en deploy/docker-compose.prod.yml.

# Nombre fijo: si se deduce de la carpeta ("backend") choca con cualquier otro
# proyecto que tambien viva en una carpeta asi y compartirian contenedores.
# Es "fragance" para seguir usando el volumen que ya tiene los datos locales.
name: fragance

services:
  postgres:
    image: postgres:16-alpine
    container_name: fragance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fragance
      POSTGRES_PASSWORD: fragance_dev_password
      POSTGRES_DB: fragance
    # 5434 en el host para no chocar con un Postgres ya instalado.
    ports:
      - "5434:5432"
    volumes:
      - fragance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragance -d fragance"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fragance-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lcfragance.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  fragance_postgres_data:
