name: Deploy

# Solo desde production y solo si CI paso: nunca sube una imagen rota.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lc-fragance-backend
  # El 22 esta cerrado salvo durante el despliegue; este es el grupo donde se
  # abre y se vuelve a cerrar. El identificador no es un dato sensible.
  SECURITY_GROUP: sg-0dbd60e73b5098397

jobs:
  publicar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La imagen se compila aca y no en la EC2: la t3.micro no tiene RAM.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Sin esto, un secreto mal escrito falla dentro de una accion y el log
      # no dice cual es. Aca se nombra el que falta, sin mostrar su valor.
      - name: Comprobar que estan los secretos
        env:
          CLAVE: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRETO: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USUARIO: ${{ secrets.SSH_USER }}
          LLAVE: ${{ secrets.SSH_KEY }}
        run: |
          faltan=""
          [ -z "$CLAVE" ]    && faltan="$faltan AWS_ACCESS_KEY_ID"
          [ -z "$SECRETO" ]  && faltan="$faltan AWS_SECRET_ACCESS_KEY"
          [ -z "$HOST" ]     && faltan="$faltan SSH_HOST"
          [ -z "$USUARIO" ]  && faltan="$faltan SSH_USER"
          [ -z "$LLAVE" ]    && faltan="$faltan SSH_KEY"
          if [ -n "$faltan" ]; then
            echo "Faltan estos secretos en el repositorio:$faltan"
            echo "Se cargan en Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$LLAVE" in
            *"BEGIN OPENSSH PRIVATE KEY"*) ;;
            *) echo "SSH_KEY no parece una clave privada completa"; exit 1 ;;
          esac
          echo "Los cinco secretos estan cargados."

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # El runner tiene una IP distinta cada vez: se abre solo para esa y se
      # cierra al terminar. El usuario IAM no puede hacer nada mas que esto.
      - name: Abrir el 22 para este runner
        id: abrir
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP" \
            --protocol tcp --port 22 --cidr "$IP/32"

      - uses: actions/checkout@v4

      # Sin esto, un cambio en el compose o en el Caddyfile nunca llega al
      # servidor y el despliegue sigue usando la version vieja sin avisar.
      # El .env vive solo alla y no esta en el repositorio, asi que no se pisa.
      - name: Copiar la configuración de despliegue
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy/*
          target: ~/lc-fragance-backend
          strip_components: 0

      - name: Actualizar el servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/lc-fragance-backend/deploy
            # Token de la propia ejecucion: vence solo, no hay PAT que guardar.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull backend
            # Las migraciones corren solas al arrancar el contenedor.
            docker compose -f docker-compose.prod.yml up -d
            docker logout ghcr.io
            docker image prune -f

      # Siempre, aunque el despliegue falle: si no, el puerto queda abierto.
      - name: Cerrar el 22
        if: always() && steps.abrir.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP" \
            --protocol tcp --port 22 --cidr "${{ steps.abrir.outputs.ip }}/32"
