name: Deploy

# Solo desde production y solo si CI paso: nunca sube una imagen rota.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lc-fragance-backend

jobs:
  publicar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La imagen se compila aca y no en la EC2: la t3.micro no tiene RAM.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar el servidor por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/lc-fragance-backend/deploy
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull backend
            # Las migraciones corren solas al arrancar el contenedor.
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
